<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Frame Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="landing">
    <header class="landing-header">
      <div class="landing-topbar">
        <p class="eyebrow">Photo Frame Studio</p>
        <button class="theme-toggle" data-theme-toggle type="button">Switch to dark</button>
      </div>
      <h1>Edit photos fast.</h1>
      <p class="subtitle">Choose a mode, adjust composition, and export in a few clicks.</p>
    </header>

    <section class="cards" aria-label="Editor modes">
      <a class="mode-card" href="./convert.html">
        <h2>Resize Batch</h2>
        <p>Resize multiple photos with per-image placement.</p>
      </a>

      <a class="mode-card" href="./panorama.html">
        <h2>Panorama Carousel</h2>
        <p>Split one panorama into clean carousel panels.</p>
      </a>
    </section>

    <footer class="landing-footer">Made by T.Racine - 2026</footer>
  </main>

  <script src="./theme.js"></script>
</body>
</html>
