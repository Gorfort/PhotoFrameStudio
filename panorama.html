<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panorama Carousel | Photo Frame Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="panorama-page">
  <nav class="top-nav">
    <a class="brand" href="./index.html">Photo Frame Studio</a>
    <div class="nav-links">
      <button class="theme-toggle" data-theme-toggle type="button">Switch to dark</button>
      <a class="nav-link" href="./convert.html">Resize Batch</a>
      <a class="nav-link active" href="./panorama.html">Panorama Carousel</a>
    </div>
  </nav>

  <main class="app-shell">
    <div class="panel-grid">
      <section class="control-panel">
        <div class="file-toolbar">
          <label for="fileInput" class="browse-button">Browse panorama</label>
          <input id="fileInput" class="file-input visually-hidden" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" />
          <span id="fileNameText" class="note">No file selected.</span>
        </div>

        <div class="control-scroll">
          <p id="loadStatus" class="note">Waiting for image selection.</p>

          <div class="controls">
            <div class="control-row">
              <label for="frameWidth">Frame width</label>
              <input id="frameWidth" type="number" min="200" max="4000" value="1080" />
            </div>
            <div class="control-row">
              <label for="frameHeight">Frame height</label>
              <input id="frameHeight" type="number" min="200" max="4000" value="1350" />
            </div>
            <div class="control-row">
              <label for="numFrames">Number of frames</label>
              <input id="numFrames" type="number" min="2" max="12" value="3" />
            </div>
            <div class="control-row">
              <label for="border">Outer border size</label>
              <input id="border" type="number" min="0" max="300" value="20" />
            </div>
            <div class="control-row color-row color-lock-row">
              <label for="bgColor">Frame color</label>
              <div class="color-lock-controls">
                <input id="bgColor" type="color" value="#ffffff" />
                <label class="edge-lock-inline" for="edgeLock">
                  <input id="edgeLock" type="checkbox" />
                  Edge lock
                </label>
              </div>
            </div>
            <div class="control-row">
              <label for="fitMode">Fit mode</label>
              <select id="fitMode">
                <option value="cover" selected>Cover</option>
                <option value="contain">Contain</option>
              </select>
            </div>
            <div class="control-row">
              <label for="offsetX">Panorama horizontal placement</label>
              <input id="offsetX" type="range" min="-1000" max="1000" value="0" />
            </div>
            <div class="control-row">
              <label for="offsetY">Panorama vertical placement</label>
              <input id="offsetY" type="range" min="-1000" max="1000" value="0" />
            </div>
            <div class="control-row">
              <label for="scale">Panorama zoom</label>
              <input id="scale" type="range" min="0.2" max="3" step="0.01" value="1" />
            </div>
            <div class="control-row">
              <label for="exportFormat">Export format</label>
              <select id="exportFormat">
                <option value="auto" selected>Auto (same as source)</option>
                <option value="png">PNG (best quality)</option>
                <option value="jpeg">JPEG (smaller files)</option>
              </select>
            </div>
            <div class="control-row">
              <label for="jpegQuality">JPEG quality</label>
              <input id="jpegQuality" type="range" min="70" max="100" step="1" value="96" />
            </div>
          </div>

          <div class="placement-actions">
            <button id="centerHorizontal" class="secondary" disabled>Center horizontal</button>
            <button id="centerVertical" class="secondary" disabled>Center vertical</button>
            <button id="reset" class="secondary" disabled>Reset placement</button>
          </div>
        </div>

        <div class="actions panorama-actions">
          <button id="downloadAll" class="utility-button download-action" disabled>Download all frames</button>
          <button id="downloadStrip" class="utility-button download-action" disabled>Download full strip</button>
          <button id="clear" class="utility-button clear-action" disabled>Clear</button>
        </div>
      </section>

      <section class="preview-panel">
        <div class="suite-header">
          <div id="selectedMeta" class="note">No panorama selected.</div>
          <div id="itemCount" class="note">0 frames</div>
          <button id="gridToggle" type="button" class="grid-toggle">Hide grid</button>
        </div>
        <div id="emptyState" class="note">No panorama loaded yet.</div>
        <div id="stage" class="canvas-stage hidden">
          <div class="canvas-grid-wrap cut-guides-wrap">
            <canvas id="stripCanvas" width="3240" height="1350"></canvas>
          </div>
        </div>
        <p class="note">Tip: drag directly on the big preview to reposition the panorama.</p>
        <div id="framesList" class="preview-list preview-strip frames-strip"></div>
      </section>
    </div>
  </main>

  <script src="./theme.js"></script>
  <script src="./shared.js"></script>
  <script src="./panorama.js"></script>
</body>
</html>
